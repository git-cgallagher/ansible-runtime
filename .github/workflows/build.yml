name: build

# PR: build both targets on both architectures, test, scan. Nothing is pushed.
# main: the same, then push :main and :sha-<short> (ci target: :main-ci, :sha-<short>-ci).
# Tag vX.Y.Z: push :X.Y.Z, :X.Y, :latest (+ -ci variants), refusing to overwrite an existing X.Y.Z.
# Release: a tag push gets a GitHub release listing the image's contents. A merge to main that
# only bumps git_cgallagher.* versions (Renovate's automerged PRs) is released as the next patch
# version automatically: the images just built for that commit get the version tags.
# Weekly: rebuild main so Debian security updates land without a dependency change. Every build runs
# apt-get upgrade; APT_REFRESH (the UTC date, or the run id on scheduled and manual runs) keeps a
# cached layer from holding old Debian packages.
# Security release: the daily `security` workflow dispatches this with security_release when a
# released image has a High/Critical finding that fresh Debian packages fix. It rebuilds main and
# releases it as the next patch version, if main has no unreleased image changes.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      security_release:
        description: Release this rebuild of main as the next patch version (security fixes only)
        type: boolean
        default: false
      security_note:
        description: What the release fixes (security workflow)
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/git-cgallagher/ansible-runtime
  PUBLISH: ${{ github.event_name != 'pull_request' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  # One job per architecture x target. arm64 builds natively on GitHub's arm runner
  # (no QEMU emulation). Each job builds, runs tests/smoke.sh in the image, and outside
  # PRs pushes the image by digest; the `manifest` job joins the two arches under tags.
  image:
    name: image (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [ci, runtime]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The Dockerfile's apt layer re-runs whenever this changes: daily, and on every scheduled or
      # manual run, so neither can publish a cached layer with old Debian packages.
      - name: Debian refresh key
        id: refresh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) key="run-$GITHUB_RUN_ID" ;;
            *) key=$(date -u +%F) ;;
          esac
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: APT_REFRESH=${{ steps.refresh.outputs.key }}
          load: true
          tags: ansible-runtime:test
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-${{ matrix.target }}

      - name: Smoke test
        run: docker run --rm -v "$PWD":/src -w /src ansible-runtime:test tests/smoke.sh ${{ matrix.target }}

      # .grype.yaml lists accepted findings; each needs a reason.
      - name: Accepted findings have a reason
        if: matrix.arch == 'amd64'
        run: docker run --rm -v "$PWD":/src -w /src ansible-runtime:test python tests/grype_ignores.py

      - name: Scan for fixable high and critical vulnerabilities
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ansible-runtime:test
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the Build step, so it is all cache hits; only the push is new.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: APT_REFRESH=${{ steps.refresh.outputs.key }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.target }}
          provenance: false

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Proves the ci image works for real consumers: the coverage check against every
  # git_cgallagher.* repo's declared collections, their linters, and one Molecule
  # scenario run from inside the image against the runner's Docker daemon.
  consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Debian refresh key
        id: refresh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) key="run-$GITHUB_RUN_ID" ;;
            *) key=$(date -u +%F) ;;
          esac
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ci
          platforms: linux/amd64
          build-args: APT_REFRESH=${{ steps.refresh.outputs.key }}
          load: true
          tags: ansible-runtime:test
          cache-from: type=gha,scope=amd64-ci

      - name: Check out the consumer collections (main)
        run: |
          for r in ansible-collection-isc ansible-collection-windows ansible-collection-orchestration ansible-collection-aws ansible-collection-vmware; do
            git clone --quiet --depth 1 "https://github.com/git-cgallagher/$r" "consumers/$r"
          done

      - name: Every declared collection is pinned, inside its range
        run: |
          docker run --rm -v "$PWD":/src -w /src ansible-runtime:test \
            python tests/coverage.py consumers/ansible-collection-isc \
              consumers/ansible-collection-windows consumers/ansible-collection-orchestration \
              consumers/ansible-collection-aws consumers/ansible-collection-vmware

      # Early warning: a collection raising a Python floor on main (say boto3) fails here
      # before its Galaxy release reaches the runtime image's build.
      - name: python.txt satisfies every consumer's requirements.txt
        run: |
          docker run --rm -v "$PWD":/src -w /src ansible-runtime:test \
            python tests/collection_requirements.py consumers/ansible-collection-isc \
              consumers/ansible-collection-windows consumers/ansible-collection-orchestration \
              consumers/ansible-collection-aws consumers/ansible-collection-vmware

      - name: yamllint + ansible-lint (isc, windows, aws, vmware)
        run: |
          for r in ansible-collection-isc ansible-collection-windows ansible-collection-aws ansible-collection-vmware; do
            echo "::group::$r"
            docker run --rm -v "$PWD/consumers/$r":/work ansible-runtime:test \
              bash -c 'yamllint . && ansible-lint'
            echo "::endgroup::"
          done

      # The checkout is mounted at /work while the host sees it elsewhere, the same
      # path mismatch a `container:` job has; the test containers must not care.
      - name: Molecule from inside the image (isc kea_dhcp, Debian 12)
        working-directory: consumers/ansible-collection-isc
        run: |
          mkdir -p .molecule-collections/ansible_collections/git_cgallagher
          ln -sfn ../../.. .molecule-collections/ansible_collections/git_cgallagher/isc
          docker run --rm -v "$PWD":/work -v /var/run/docker.sock:/var/run/docker.sock \
            -w /work/roles/kea_dhcp ansible-runtime:test \
            molecule test -s default --platform-name kea-debian12

  manifest:
    name: manifest (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    needs: [image, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [ci, runtime]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.target == 'ci' && '-ci' || '' }},onlatest=true
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # GHCR tags are mutable. A release version must never be re-pointed: consumers pin
      # it, and the weekly rebuild only ever moves :main.
      - name: Refuse to overwrite an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.target == 'ci' && '-ci' || '' }}
        run: |
          tag="$IMAGE:${REF#v}$SUFFIX"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; release a new version instead"
            exit 1
          fi

      - name: Create the multi-arch manifest
        id: create
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          first=$(head -n1 <<< "$TAGS")
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.create.outputs.digest }}
          push-to-registry: true

  # Runs after the manifests exist. On a tag: a GitHub release for it. On a merge to main whose
  # only change is git_cgallagher.* version lines in collections-runtime.yml: the next patch
  # version, made by tagging this commit's sha- images (already built, tested and attested) and
  # creating the git tag + GitHub release through the API. A tag pushed with GITHUB_TOKEN starts
  # no workflow, so nothing rebuilds. On a security_release dispatch: the same, from the :main
  # images this run just pushed, when nothing that goes into the image changed since the last
  # release. Anything else on main is released by hand (AGENTS.md).
  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.security_release)
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # the git tag and the GitHub release
      packages: write  # the version tags on GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the version
        id: version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; echo "auto=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<<"${last#v}"
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then echo "::error::security_release runs on main only"; exit 1; fi
            # The same paths security.yml checks: what goes into the image.
            unreleased=$(git diff --name-only "$last" HEAD -- Dockerfile requirements build tests/collection_requirements.py)
            if [ -n "$unreleased" ]; then
              echo "::error::main changed the image since $last ($unreleased); release it by hand"; exit 1
            fi
            { echo "version=$major.$minor.$((patch + 1))"; echo "auto=security"; echo "source=main"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          changed=$(git diff -U0 HEAD^1 HEAD -- requirements/collections-runtime.yml | grep -E '^[-+][^-+]' || true)
          if [ "$files" != requirements/collections-runtime.yml ] || grep -qvE '^[-+] +version: ' <<<"$changed"; then
            echo "Not a collection-version-only merge; release by hand if needed."; exit 0
          fi
          { echo "version=$major.$minor.$((patch + 1))"; echo "auto=collections"; echo "source=sha-${GITHUB_SHA::7}"; } >> "$GITHUB_OUTPUT"
          echo "Collection bump after $last:"; echo "$changed"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.version.outputs.version != ''
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: steps.version.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main is this run's image on a dispatch: build runs on main queue (concurrency group), so no
      # other run moves :main before this job.
      - name: Tag the images just built as the new version
        if: steps.version.outputs.auto == 'collections' || steps.version.outputs.auto == 'security'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          for suffix in "" -ci; do
            if docker buildx imagetools inspect "$IMAGE:$VERSION$suffix" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$VERSION$suffix already exists"; exit 1
            fi
            docker buildx imagetools create \
              -t "$IMAGE:$VERSION$suffix" -t "$IMAGE:${VERSION%.*}$suffix" -t "$IMAGE:latest$suffix" \
              "$IMAGE:$SOURCE$suffix"
          done

      - name: Create the GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          AUTO: ${{ steps.version.outputs.auto }}
          NOTE: ${{ inputs.security_note }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          {
            if [ "$AUTO" = collections ]; then
              echo "Automatic release: a git_cgallagher.* collection version bump."
              echo
              git diff -U0 HEAD^1 HEAD -- requirements/collections-runtime.yml | grep -E '^[-+] ' | sed 's/^/    /'
            elif [ "$AUTO" = security ]; then
              echo "Automatic security release: a rebuild of \`main\` with current Debian packages, from the daily \`security\` workflow. ${NOTE:-}"
              echo
              echo "No pinned version changed; nothing that goes into the image changed since the previous release."
            else
              echo "See CHANGELOG.md for what changed."
            fi
            echo
            echo "\`$IMAGE:$VERSION\` (runtime) and \`$IMAGE:$VERSION-ci\` (ci: same, without the git_cgallagher collections marked runtime-only). Contents:"
            echo
            docker run --rm -v "$PWD":/src -w /src "$IMAGE:$VERSION" python tests/contents.py
          } > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
